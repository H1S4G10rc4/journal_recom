<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>朝の論文帖</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/math-config.js"></script>
    <script defer src="/mathjax/es5/tex-svg-full.js"></script>
    <script defer src="/static/app.js"></script>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <span class="wordmark">朝の論文帖</span>
        <p id="startup" role="status">デスクを開いています…</p>
      </div>
    </div>
    <div id="toast" role="status" hidden></div>
    <dialog id="lightbox">
      <button id="close-figure" aria-label="図を閉じる">×</button
      ><img alt="原図の拡大表示" />
      <p></p>
    </dialog>
  </body>
</html>
