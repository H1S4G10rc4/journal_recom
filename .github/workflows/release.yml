name: Build and check desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: "--linux --x64"
          - name: windows-x64
            os: windows-latest
            target: "--win --x64"
          - name: macos-arm64
            os: macos-latest
            target: "--mac --arm64"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: node scripts/check-release.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run dist -- ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Include source archive
        if: runner.os == 'Linux'
        run: npm run source
      - run: npm run checksums
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Paper-Desk-${{ matrix.name }}
          retention-days: 14
          path: |
            release/*.AppImage
            release/*.tar.gz
            release/*.exe
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

  draft-release:
    name: Prepare draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Collect artifacts and create draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts
          mkdir release
          find artifacts -type f ! -name SHA256SUMS.txt -exec cp {} release/ \;
          npm run checksums
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --title "Paper Desk $GITHUB_REF_NAME" --notes-file CHANGELOG.md
